name: CI

on:
  pull_request:
  push:
    branches: [main, rewrite/polyglot]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build, tests (embedded PGlite)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate ephemeral CI-only secret (never a real value)
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test

  external-postgres:
    name: Tests against PostgreSQL 16 (DATABASE_URL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solob_ci
          POSTGRES_PASSWORD: solob_ci_only_password
          POSTGRES_DB: solob_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solob_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
      SOLOB_TEST_ALLOW_DESTRUCTIVE_DB_RESET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate ephemeral CI-only secret (never a real value)
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test

  # ---------------- Polyglot stack (rewrite/polyglot) ----------------
  gateway-rust:
    name: Gateway (Rust) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: polyglot/gateway-rust}}
    env:
      TEST_DATABASE_ADMIN_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: polyglot/gateway-rust}
      - run: cargo build --locked
      - run: cargo test --locked

  school-python:
    name: School (Python 3.13 + C++ grader) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: polyglot/school-python/requirements.txt}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build C++ grader
        working-directory: polyglot/grading-cpp
        run: cmake -S . -B build -G Ninja && cmake --build build
      - run: pip install -r requirements.txt pytest
        working-directory: polyglot/school-python
      - name: Apply db/migrations/0*.sql in order
        run: for f in $(ls db/migrations/0*.sql | sort); do echo "applying $f"; psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: python -m pytest -q
        working-directory: polyglot/school-python
        env: {GRADER_BIN: '${{ github.workspace }}/polyglot/grading-cpp/build/solob-grade'}

  grading-cpp:
    name: Grading engine (C++)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: polyglot/grading-cpp}}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ctest --test-dir build --output-on-failure

  business-java:
    name: Business (Java 21) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: polyglot/business-java}}
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Apply db/migrations/0*.sql in order
        working-directory: ${{ github.workspace }}
        run: for f in $(ls db/migrations/0*.sql | sort); do echo "applying $f"; psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: mvn -B test

  docker-smoke:
    name: Docker images (buildx, no push) + compose smoke
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: polyglot}}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Generate ephemeral CI-only .env (random, never real values, never committed)
        run: |
          pw=$(openssl rand -hex 16); echo "::add-mask::$pw"
          { echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"; echo "SESSION_SECRET=$(openssl rand -hex 32)";
            echo "SERVICE_SECRET=$(openssl rand -hex 32)"; echo "APP_ENV=staging"; } > .env
          echo "SMOKE_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Build all images with buildx (gateway Rust, School Python+C++, Business Java)
        run: docker buildx bake --allow=fs.read=.. -f docker-compose.yml --load gateway school business solob-local
      - name: Images run as non-root and declare a HEALTHCHECK
        run: |
          for i in gateway school business solob-local; do
            u=$(docker image inspect solob-plus/$i:local --format '{{.Config.User}}')
            hc=$(docker image inspect solob-plus/$i:local --format '{{if .Config.Healthcheck}}yes{{end}}')
            echo "$i user=$u healthcheck=$hc"; [ -n "$u" ] && [ "$u" != root ] && [ "$u" != 0 ] && [ "$hc" = yes ]
          done
      - name: Start stack (PG16 -> migrate -> school/business healthy -> gateway)
        run: |
          docker compose --env-file .env up -d --no-build gateway
          for n in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --env-file .env ps -q gateway)" 2>/dev/null || true)
            [ "$s" = healthy ] && { echo "gateway healthy after ~$((n*3))s"; docker compose --env-file .env ps -a; exit 0; }; sleep 3
          done; echo "gateway not healthy"; exit 1
      - name: Bootstrap the one-time admin (CLI, idempotency guarded by the DB)
        run: >-
          docker compose --env-file .env run --rm --no-deps
          -e BOOTSTRAP_ADMIN_EMAIL=smoke.admin@example.org -e BOOTSTRAP_ADMIN_PASSWORD -e BOOTSTRAP_ADMIN_NAME="CI Smoke Admin"
          gateway bootstrap-admin
        env: {BOOTSTRAP_ADMIN_PASSWORD: '${{ env.SMOKE_ADMIN_PASSWORD }}'}
      - name: End-to-end smoke through the gateway
        run: python3 scripts/smoke_e2e.py
        env: {SMOKE_ADMIN_EMAIL: smoke.admin@example.org, SMOKE_ADMIN_PASSWORD: '${{ env.SMOKE_ADMIN_PASSWORD }}'}
      - name: Demo seed, run twice (idempotent)
        run: python3 scripts/seed_demo.py && python3 scripts/seed_demo.py
        env: {SEED_ADMIN_EMAIL: smoke.admin@example.org, SEED_ADMIN_PASSWORD: '${{ env.SMOKE_ADMIN_PASSWORD }}'}
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env ps -a; docker compose --env-file .env logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose --env-file .env down -v

  solob-ai:
    name: SOLOB AI (Python, CPU) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SAKC_TEST_PG_DSN: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
    defaults: {run: {working-directory: polyglot/solob-ai}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: polyglot/solob-ai/requirements.in}
      - run: pip install -r requirements.in
      - run: python -m pytest -q

  solob-local:
    name: solob-local (Rust, candle) — parity vs PyTorch + API + School e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: polyglot/solob-local-rs}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: Reference stack (PyTorch CPU) for the parity fixture
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu sentencepiece==0.2.2 safetensors==0.8.0 numpy==2.5.4
      - name: Export a random-init fixture (no real weights in CI)
        working-directory: polyglot/solob-local-rs
        run: python tools/export_weights.py --random-init --out "$RUNNER_TEMP/slfix"
      - name: cargo test (parity logits <= 1e-4, tokenizer, greedy, API, limits, timeout)
        working-directory: polyglot/solob-local-rs
        env: {SOLOB_LOCAL_PARITY_DIRS: '${{ runner.temp }}/slfix'}
        run: cargo test --locked --release -- --nocapture
      - name: End-to-end with School's local_provider (loopback)
        run: |
          B=polyglot/solob-local-rs/target/release/solob-local
          SOLOB_LOCAL_SERVE=1 SOLOB_LOCAL_BIND=127.0.0.1:8300 SOLOB_LOCAL_MODEL_DIR="$RUNNER_TEMP/slfix" $B > "$RUNNER_TEMP/sl.log" 2>&1 &
          for n in $(seq 1 30); do SOLOB_LOCAL_BIND=127.0.0.1:8300 $B healthcheck && break; sleep 1; done
          cd polyglot/school-python
          SOLOB_LOCAL_ENABLED=1 SOLOB_LOCAL_URL=http://127.0.0.1:8300/generate python3 -c "
          from solob_school import local_provider as l; r=l.generate('Bonjour le Bénin'); print(r)
          assert r and r['model'].startswith('solob-local:') and r['completion_tokens']>=0"
          cat "$RUNNER_TEMP/sl.log"; ! grep -q 'Bonjour' "$RUNNER_TEMP/sl.log"
