name: CI

on:
  pull_request:
  push:
    branches: [main, rewrite/polyglot]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, build, tests (embedded PGlite)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate ephemeral CI-only secret (never a real value)
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test

  external-postgres:
    name: Tests against PostgreSQL 16 (DATABASE_URL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solob_ci
          POSTGRES_PASSWORD: solob_ci_only_password
          POSTGRES_DB: solob_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solob_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
      SOLOB_TEST_ALLOW_DESTRUCTIVE_DB_RESET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate ephemeral CI-only secret (never a real value)
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test

  # ---------------- Polyglot stack (rewrite/polyglot) ----------------
  gateway-rust:
    name: Gateway (Rust) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: polyglot/gateway-rust}}
    env:
      TEST_DATABASE_ADMIN_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: polyglot/gateway-rust}
      - run: cargo build --locked
      - run: cargo test --locked

  school-python:
    name: School (Python 3.13 + C++ grader) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: polyglot/school-python/requirements.txt}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build C++ grader
        working-directory: polyglot/grading-cpp
        run: cmake -S . -B build -G Ninja && cmake --build build
      - run: pip install -r requirements.txt pytest
        working-directory: polyglot/school-python
      - run: python -m pytest -q
        working-directory: polyglot/school-python
        env: {GRADER_BIN: '${{ github.workspace }}/polyglot/grading-cpp/build/solob-grade'}

  grading-cpp:
    name: Grading engine (C++)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: polyglot/grading-cpp}}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ctest --test-dir build --output-on-failure

  business-java:
    name: Business (Java 21) vs PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: solob_ci, POSTGRES_PASSWORD: solob_ci_only_password, POSTGRES_DB: solob_ci}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U solob_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: polyglot/business-java}}
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://solob_ci:solob_ci_only_password@localhost:5432/solob_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B test
